{{define "list"}} {{template "head" .}} {{template "header" .}}
<main class="container">
  <h1 class="page-title">
    {{if .Dir}}{{.Dir}}{{else}}{{t "ThemeHomeTitle"}}{{end}}
  </h1>
  <ul class="doc-list">
    {{range .Docs}}
    <li class="doc-item">
      <a class="doc-link" href="{{url .Route}}">{{.Title}}</a>
      {{if .Date}}<span class="doc-date">{{formatDate .Date}}</span>{{end}}
    </li>
    {{end}}
  </ul>
</main>
{{template "footer" .}} {{end}}
