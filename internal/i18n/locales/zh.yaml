CliRootTitle: "Plainship 是一个本地优先, Markdown 优先, Git 优先的文档发布系统."
CliRootTagline: "一个目录 + Markdown + Git + 一个命令 = 一个网站."
CliNewLong: "创建新的 Plainship Space.\n\n将指定目录初始化为 Plainship 文档空间:\n  - 生成 docs, themes 等目录\n  - 写入默认配置与默认主题\n  - 默认初始化 Git 仓库 (版本管理)\n\n示例:\n  plainship new .       使用当前目录\n  plainship new mydoc   使用新目录"
CliCreateLong: "在当前 Plainship Space 中创建 Markdown 文档.\n\n自动补全 .md 扩展名, 支持中文文件名与嵌套目录.\n\n示例:\n  plainship create \"测试文档\"\n  plainship create \"guide/快速开始\""
CliBuildLong: "构建当前 Space 并写入 Git 历史.\n\n流程:\n  1. 检测变更: config / themes / docs 三类各自提交\n  2. 构建到 build/\n  3. 构建成功后才分步提交, 并打编号 tag (ps-0001, ps-0002, ...)\n  4. 构建失败则什么都不提交, 也不打号\n\n提交信息由程序生成: <类别> build=<编号> hash=<指纹>.\n-m 的消息只作为 docs 提交的备注 (body), 不影响机器解析.\n\n示例:\n  plainship build\n  plainship build -m \"发布测试文档\""
CliPublishLong: "将构建产物发布到配置的服务器.\n\n发布前会校验:\n  1. 当前源码必须等于已提交内容 (无未提交变更)\n  2. build/ 必须由当前源码构建\n\n不满足任一条件则拒绝发布, 请先运行 plainship build."
CliServeLong: "启动 Plainship Server.\n\n服务器只做三件事: 存储, 同步, 静态 HTTP.\n不编译 Markdown, 不需要数据库.\n\n数据目录在启动时自动创建; 其中的站点子目录\n在收到该站点的首次同步请求后才会生成.\n\n示例:\n  plainship serve\n  plainship serve --addr :9090 --data ./data\n  plainship serve --token my-secret-token\n\n访问令牌:\n  不传 --token 时自动生成一个随机令牌, 保存到 <数据目录>/server.token.\n  启动信息中会打印令牌, 复制后在客户端运行 plainship connect 即可连接."
CliStatusLong: "查看 Space 的完整状态:\n  - Git 分支与 config/theme/docs 各类别变更\n  - 构建编号与上次构建时间\n  - 服务器发布状态\n\n示例:\n  plainship status"
CliDevLong: "本地开发模式:\n  - 首次自动构建\n  - 监听 docs / themes / plainship.yaml 变更\n  - 变更后自动重新构建并通知浏览器热更新 (无需手动刷新)\n  - 只构建, 不提交 Git, 不打构建编号\n\n示例:\n  plainship dev\n  plainship dev --addr 8080"

