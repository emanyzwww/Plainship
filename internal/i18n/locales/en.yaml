CliRootTitle: "Plainship is a local-first, Markdown-first, Git-first publishing system."
CliRootTagline: "One directory + Markdown + Git + one command = one website."
CliNewLong: "Create a new Plainship Space.\n\nInitializes the given directory as a Plainship document Space:\n  - creates the docs and themes directories\n  - writes the default config and default theme\n  - initializes a Git repository by default (version management)\n\nExamples:\n  plainship new .       use the current directory\n  plainship new mydoc   use a new directory"
CliCreateLong: "Create a Markdown document in the current Plainship Space.\n\nAutomatically appends the .md extension; supports Chinese file names and nested directories.\n\nExamples:\n  plainship create \"my-doc\"\n  plainship create \"guide/quick-start\""
CliBuildLong: "Build the current Space and write it into Git history.\n\nFlow:\n  1. Detect changes: config / themes / docs are committed separately\n  2. Build into build/\n  3. Only after a successful build, commit in steps and tag (ps-0001, ps-0002, ...)\n  4. On build failure, nothing is committed and no number is assigned\n\nCommit messages are generated: <category> build=<number> hash=<fingerprint>.\nThe -m message is only a note (body) for the docs commit; it does not affect machine parsing.\n\nExamples:\n  plainship build\n  plainship build -m \"release test docs\""
CliPublishLong: "Publish the build output to the configured server.\n\nBefore publishing, Plainship verifies:\n  1. Current sources equal the committed content (no uncommitted changes)\n  2. build/ was built from the current sources\n\nIf either check fails, publishing is refused; run plainship build first."
CliServeLong: "Start the Plainship Server.\n\nThe server does only three things: storage, sync and static HTTP.\nIt never compiles Markdown and needs no database.\n\nThe data directory is created on startup; site subdirectories\nare created after the first sync request for that site.\n\nExamples:\n  plainship serve\n  plainship serve --addr :9090 --data ./data\n  plainship serve --token my-secret-token\n\nAccess token:\n  Without --token, a random token is generated and saved to <data dir>/server.token.\n  The token is printed at startup; copy it and run plainship connect on the client."
CliStatusLong: "Show the full status of the Space:\n  - Git branch and changes per category (config / theme / docs)\n  - build number and last build time\n  - server publish status\n\nExamples:\n  plainship status"
CliDevLong: "Local development mode:\n  - builds automatically on start\n  - watches docs / themes / plainship.yaml for changes\n  - rebuilds and notifies the browser to hot reload on change (no manual refresh)\n  - builds only: no Git commit, no build number\n\nExamples:\n  plainship dev\n  plainship dev --addr 8080"

