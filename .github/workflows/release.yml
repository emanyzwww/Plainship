name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: windows
            goarch: arm64
            ext: '.exe'
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w -X github.com/emanyzwww/plainship/internal/version.Version=$version"
          mkdir -p dist
          # 客户端 (cmd/plainship) 与服务端 (cmd/plainship-server) 一起发布,
          # 共享 internal/version, 版本一一对应.
          for entry in "plainship:./cmd/plainship" "plainship-server:./cmd/plainship-server"; do
            prefix="${entry%%:*}"
            pkg="${entry#*:}"
            name="${prefix}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
            go build -trimpath -ldflags "$ldflags" -o "dist/$name" "$pkg"
            (cd dist && sha256sum "$name" > "$name.sha256")
          done

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.goos }}-${{ matrix.goarch }}"
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
